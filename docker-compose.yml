services:
  mysql:
    image: mysql:8.0
    container_name: reachinbox-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: reachinbox_root_password
      MYSQL_DATABASE: reachinbox
      MYSQL_USER: reachinbox_user
      MYSQL_PASSWORD: reachinbox_secret_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=reachinbox_root_password >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: reachinbox-elasticsearch
    restart: always
    environment:
      - node.name=reachinbox-es
      - cluster.name=reachinbox-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://reachinbox_user:reachinbox_secret_password@mysql:3306/reachinbox
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000
      JWT_SECRET: super_secure_jwt_secret_reachinbox_2026
      SESSION_SECRET: super_secure_session_secret_reachinbox_2026
      WORKER_CONCURRENCY: 5
      MIN_EMAIL_DELAY_MS: 2000
      MAX_EMAILS_PER_HOUR: 200
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reachinbox-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  es_data:
    driver: local
